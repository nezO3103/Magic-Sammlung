const RARITY_ORDER = {mythic:0,rare:1,uncommon:2,common:3};
function render(){
  const search=document.getElementById('search').value.toLowerCase();
  const sort=document.getElementById('sort').value;
  const rarity=document.getElementById('rarity').value;
  let f=CARDS.filter(c=>{
    if(rarity!=='all'&&c.rarity!==rarity)return false;
    if(search&&!c.name.toLowerCase().includes(search))return false;
    return true;
  });
  f.sort((a,b)=>{
    if(sort==='name')return a.name.localeCompare(b.name);
    if(sort==='price_desc')return b.price-a.price;
    if(sort==='price_asc')return a.price-b.price;
    if(sort==='rarity')return(RARITY_ORDER[a.rarity]??9)-(RARITY_ORDER[b.rarity]??9);
    return 0;
  });
  document.getElementById('shown').textContent=f.length;
  document.getElementById('total').textContent=CARDS.length;
  document.getElementById('hdr-count').textContent=CARDS.length+' Karten im Deck';
  const grid=document.getElementById('grid');
  const empty=document.getElementById('empty');
  if(f.length===0){grid.innerHTML='';empty.style.display='block';return;}
  empty.style.display='none';
  grid.innerHTML=f.map(c=>{
    const p=c.price>0?c.price.toFixed(2)+' €':'—';
    const img=c.img?'<img src="'+c.img+'" alt="" loading="lazy">':'<div class="no-img">'+c.name+'</div>';
    const foil=c.foil?'<span class="foil-badge">FOIL</span>':'';
    const ne=c.name.replace(/"/g,'&quot;');
    return '<div class="card-wrap"><div class="card-img-box">'+img+foil+'<div class="rarity-bar r-'+c.rarity+'"></div></div>'
      +'<div class="card-name" title="'+ne+'">'+c.name+'</div>'
      +'<div class="card-meta"><span class="card-set">'+c.set+'</span><span class="card-price">'+p+'</span></div>'
      +'<a class="cm-link" href="'+c.cm+'" target="_blank">Cardmarket →</a></div>';
  }).join('');
}
render();
