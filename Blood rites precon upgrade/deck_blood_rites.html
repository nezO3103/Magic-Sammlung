    .card-wrap{display:flex;flex-direction:column;gap:6px}
    .card-img-box{position:relative;border-radius:10px;overflow:hidden;box-shadow:0 3px 12px rgba(0,0,0,.6);transition:transform .18s,box-shadow .18s;background:#1a1a1a;aspect-ratio:5/7}

    .deck-badge{position:absolute;bottom:8px;left:6px;font-size:.6rem;font-weight:bold;padding:2px 6px;border-radius:3px;z-index:2;letter-spacing:.3px}
    .deck-blood-rites{background:rgba(192,57,43,.85);color:#fff}

    .deck-creative-energy{background:rgba(41,128,185,.85);color:#fff}
    .rarity-bar{position:absolute;bottom:0;left:0;right:0;height:3px}

    .no-img{display:flex;align-items:center;justify-content:center;height:100%;font-size:.7rem;color:#444;text-align:center;padding:8px}
    .card-name{font-size:.75rem;color:#ccc;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .card-meta{display:flex;justify-content:space-between;align-items:center}
    .card-set{font-size:.65rem;color:#555}
    .card-price{font-size:.7rem;color:var(--accent,#c0a060);font-weight:bold}

const RARITY_ORDER = {mythic:0,rare:1,uncommon:2,common:3};
const DECK_LABELS = {
  'blood-rites':    {label:'Blood Rites',    cls:'deck-blood-rites'},
  'limit-break':    {label:'Limit Break',    cls:'deck-limit-break'},
  'creative-energy':{label:'Creative Energy',cls:'deck-creative-energy'}
};

function renderCards(cards, gridId, shownId, totalId, hdrId) {
  const grid  = document.getElementById(gridId);
  const empty = document.getElementById('empty');
  document.getElementById(shownId).textContent = cards.length;
  if (totalId) document.getElementById(totalId).textContent = CARDS.length;
  if (hdrId)   document.getElementById(hdrId).textContent = CARDS.length + ' Karten im Deck';
  if (cards.length === 0) { grid.innerHTML = ''; if(empty) empty.style.display='block'; return; }
  if(empty) empty.style.display='none';
  grid.innerHTML = cards.map(c => {
    const p = c.price > 0 ? c.price.toFixed(2) + ' €' : '—';
    const img = c.img
      ? '<img src="' + c.img + '" alt="" loading="lazy">'
      : '<div class="no-img">' + c.name + '</div>';
    const foilOverlay = c.foil ? '<div class="foil-overlay"></div>' : '';
    const foilBadge   = c.foil ? '<span class="foil-badge">FOIL</span>' : '';
    const qty  = parseInt(c.qty) > 1 ? '<span class="qty-badge">×' + c.qty + '</span>' : '';
    const dl   = c.deck && DECK_LABELS[c.deck];
    const deck = dl ? '<span class="deck-badge ' + dl.cls + '">' + dl.label + '</span>' : '';
    const ne   = c.name.replace(/"/g,'&quot;');
    return '<div class="card-wrap">'
      + '<div class="card-img-box">' + img + foilOverlay + foilBadge + qty + deck
      + '<div class="rarity-bar r-' + c.rarity + '"></div></div>'
      + '<div class="card-name" title="' + ne + '">' + c.name + '</div>'
      + '<div class="card-meta"><span class="card-set">' + c.set + '</span>'
      + '<span class="card-price">' + p + '</span></div>'
      + '<a class="cm-link" href="' + c.cm + '" target="_blank">Cardmarket →</a>'
      + '</div>';
  }).join('');
}

function render(){
  const s=document.getElementById('search').value.toLowerCase();
  const so=document.getElementById('sort').value;
  const r=document.getElementById('rarity').value;
  let f=CARDS.filter(c=>{
    if(r!=='all'&&c.rarity!==r)return false;
    if(s&&!c.name.toLowerCase().includes(s))return false;
    return true;
  });
  f.sort((a,b)=>{
    if(so==='name')return a.name.localeCompare(b.name);
    if(so==='price_desc')return b.price-a.price;
    if(so==='price_asc')return a.price-b.price;
    if(so==='rarity')return(RARITY_ORDER[a.rarity]??9)-(RARITY_ORDER[b.rarity]??9);
    return 0;
  });
  renderCards(f,'grid','shown',null,'hdr');
  document.getElementById('total').textContent=CARDS.length;
}
render();
