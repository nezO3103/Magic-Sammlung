<title>Creative Energy — Precon</title>
<style>:root{--accent:#2980b9}
    *{box-sizing:border-box;margin:0;padding:0}

    header{background:linear-gradient(135deg,#0d0d0d 0%,#1a1a2e 100%);border-bottom:2px solid var(--accent,#2a2a4a);padding:28px 40px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px}

    header p{color:#555;font-size:0.8rem;margin-top:4px}
    .nav{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .nav-link{background:#161616;border:1px solid #2a2a2a;padding:7px 16px;border-radius:4px;color:#aaa;text-decoration:none;font-size:0.82rem;transition:background .15s,color .15s}
    .nav-link:hover{background:#1e1e1e;color:#e8e0d0}
    .nav-link.hl{border-color:var(--accent,#555);color:var(--accent,#aaa)}
    /* Controls */
    .controls{background:#111;border-bottom:1px solid #1e1e1e;padding:14px 40px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
    .controls input{background:#1a1a1a;border:1px solid #333;border-radius:4px;color:#e8e0d0;padding:8px 14px;font-size:0.85rem;width:220px;outline:none}
    .controls input:focus{border-color:#555}
    .controls select{background:#1a1a1a;border:1px solid #333;border-radius:4px;color:#e8e0d0;padding:8px 12px;font-size:0.85rem;outline:none;cursor:pointer}
    .stats{margin-left:auto;font-size:0.78rem;color:#555}
    .stats span{color:var(--accent,#c0a060);font-weight:bold}
    /* Grid */
    #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;padding:24px 40px;max-width:1600px;margin:0 auto}
    .card-wrap{display:flex;flex-direction:column;gap:6px}
    .card-img-box{position:relative;border-radius:10px;overflow:hidden;box-shadow:0 3px 12px rgba(0,0,0,.6);transition:transform .18s,box-shadow .18s;background:#1a1a1a;aspect-ratio:5/7}
    .card-img-box:hover{transform:translateY(-5px) scale(1.02);box-shadow:0 10px 30px rgba(0,0,0,.8);z-index:10}
    .card-img-box img{width:100%;height:100%;object-fit:cover;display:block;border-radius:10px}
    .foil-overlay{position:absolute;inset:0;background:linear-gradient(125deg,transparent 20%,rgba(255,215,0,.15) 40%,rgba(180,180,255,.2) 50%,rgba(255,182,193,.15) 60%,transparent 80%);background-size:200% 200%;pointer-events:none;border-radius:10px;animation:foilShimmer 2.5s ease-in-out infinite}
    @keyframes foilShimmer{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
    .foil-badge{position:absolute;top:6px;right:6px;background:linear-gradient(135deg,#b8860b,#ffd700,#b8860b);color:#000;font-size:.6rem;font-weight:bold;padding:2px 6px;border-radius:3px;z-index:2}
    .qty-badge{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.75);color:#ccc;font-size:.65rem;padding:2px 6px;border-radius:3px;z-index:2}
    .deck-badge{position:absolute;bottom:8px;left:6px;font-size:.6rem;font-weight:bold;padding:2px 6px;border-radius:3px;z-index:2;letter-spacing:.3px}
    .deck-blood-rites{background:rgba(192,57,43,.85);color:#fff}
    .deck-limit-break{background:rgba(232,160,32,.85);color:#000}
    .deck-creative-energy{background:rgba(41,128,185,.85);color:#fff}
    .rarity-bar{position:absolute;bottom:0;left:0;right:0;height:3px}
    .r-common{background:#555}.r-uncommon{background:#aaa}.r-rare{background:#c0a060}.r-mythic{background:linear-gradient(90deg,#c0392b,#e67e22)}
    .no-img{display:flex;align-items:center;justify-content:center;height:100%;font-size:.7rem;color:#444;text-align:center;padding:8px}
    .card-name{font-size:.75rem;color:#ccc;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .card-meta{display:flex;justify-content:space-between;align-items:center}
    .card-set{font-size:.65rem;color:#555}
    .card-price{font-size:.7rem;color:var(--accent,#c0a060);font-weight:bold}
    .cm-link{display:block;text-align:center;font-size:.65rem;color:#555;text-decoration:none;padding:3px 0;border:1px solid #222;border-radius:3px;transition:color .1s,border-color .1s}
    .cm-link:hover{color:var(--accent,#c0a060);border-color:var(--accent,#c0a060)}
    #empty{display:none;text-align:center;color:#444;padding:80px 40px;font-size:1rem}
    footer{text-align:center;padding:32px;color:#333;font-size:.75rem;border-top:1px solid #1a1a1a;margin-top:40px}
</style>

const RARITY_ORDER = {mythic:0,rare:1,uncommon:2,common:3};
const DECK_LABELS = {
  'blood-rites':    {label:'Blood Rites',    cls:'deck-blood-rites'},
  'limit-break':    {label:'Limit Break',    cls:'deck-limit-break'},
  'creative-energy':{label:'Creative Energy',cls:'deck-creative-energy'}
};

function renderCards(cards, gridId, shownId, totalId, hdrId) {
  const grid  = document.getElementById(gridId);
  const empty = document.getElementById('empty');
  document.getElementById(shownId).textContent = cards.length;
  if (totalId) document.getElementById(totalId).textContent = CARDS.length;
  if (hdrId)   document.getElementById(hdrId).textContent = CARDS.length + ' Karten im Deck';
  if (cards.length === 0) { grid.innerHTML = ''; if(empty) empty.style.display='block'; return; }
  if(empty) empty.style.display='none';
  grid.innerHTML = cards.map(c => {
    const p = c.price > 0 ? c.price.toFixed(2) + ' €' : '—';
    const img = c.img
      ? '<img src="' + c.img + '" alt="" loading="lazy">'
      : '<div class="no-img">' + c.name + '</div>';
    const foilOverlay = c.foil ? '<div class="foil-overlay"></div>' : '';
    const foilBadge   = c.foil ? '<span class="foil-badge">FOIL</span>' : '';
    const qty  = parseInt(c.qty) > 1 ? '<span class="qty-badge">×' + c.qty + '</span>' : '';
    const dl   = c.deck && DECK_LABELS[c.deck];
    const deck = dl ? '<span class="deck-badge ' + dl.cls + '">' + dl.label + '</span>' : '';
    const ne   = c.name.replace(/"/g,'&quot;');
    return '<div class="card-wrap">'
      + '<div class="card-img-box">' + img + foilOverlay + foilBadge + qty + deck
      + '<div class="rarity-bar r-' + c.rarity + '"></div></div>'
      + '<div class="card-name" title="' + ne + '">' + c.name + '</div>'
      + '<div class="card-meta"><span class="card-set">' + c.set + '</span>'
      + '<span class="card-price">' + p + '</span></div>'
      + '<a class="cm-link" href="' + c.cm + '" target="_blank">Cardmarket →</a>'
      + '</div>';
  }).join('');
}

function render(){
  const s=document.getElementById('search').value.toLowerCase();
  const so=document.getElementById('sort').value;
  const r=document.getElementById('rarity').value;
  let f=CARDS.filter(c=>{
    if(r!=='all'&&c.rarity!==r)return false;
    if(s&&!c.name.toLowerCase().includes(s))return false;
    return true;
  });
  f.sort((a,b)=>{
    if(so==='name')return a.name.localeCompare(b.name);
    if(so==='price_desc')return b.price-a.price;
    if(so==='price_asc')return a.price-b.price;
    if(so==='rarity')return(RARITY_ORDER[a.rarity]??9)-(RARITY_ORDER[b.rarity]??9);
    return 0;
  });
  renderCards(f,'grid','shown',null,'hdr');
  document.getElementById('total').textContent=CARDS.length;
}
render();
